plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

loom {
    silentMojangMappingsLicense()

    forge {
        mixinConfig 'lunarfossils.mixins.json'
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }

    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
        content {
            includeGroup 'com.github.glitchfiend'
        }
    }

    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'dev.onyxstudios.cardinal-components-api'
        }
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:$project.minecraft_version"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:$project.forge_version"


    modImplementation "dev.architectury:architectury-forge:$project.architectury_api_version"

    modImplementation "software.bernie.geckolib:geckolib-forge-$project.minecraft_version:$project.geckolib_version"
    forgeRuntimeLibrary "com.eliotlash.mclib:mclib:20"

    modImplementation "curse.maven:fossils-223908:$project.fossils_forge_file_id"

    modRuntimeOnly "com.github.glitchfiend:TerraBlender-forge:$project.minecraft_version-$project.terrablender_version"
    modImplementation "maven.modrinth:more-hitboxes:$project.morehitboxes_forge_version"

    forgeRuntimeLibrary "io.github.llamalad7:mixinextras-common:0.4.1"
    modRuntimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"

    compileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testCompileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

// Configure Maven publishing.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
